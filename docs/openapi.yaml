openapi: 3.0.3
info:
  title: Solva API
  version: 1.0.0
  description: Anonymous background removal. Upload one image, then preview or download
    the cutout from the signed URLs. The original file is not stored. Open the interactive
    docs at /api/docs/.
paths:
  /api/v1/config/:
    get:
      operationId: config_retrieve
      description: Upload limits, formats, retention, and the configured model name.
        Secrets are omitted.
      summary: Public configuration
      tags:
      - System
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
          description: ''
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: The process is up when this returns 200. Read `ai.available` before
        uploading. A degraded status still means the HTTP service is running. It does
        not mean a cutout was produced.
      summary: Service health
      tags:
      - System
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
  /api/v1/images/remove-background/:
    post:
      operationId: images_remove_background_create
      description: Send one image as multipart field `image`. The original file is
        not stored. The response contains signed URLs for the transparent PNG. 503
        means the model is unavailable. 504 means processing exceeded the timeout.
        Neither response includes a fake cutout.
      summary: Remove a background
      tags:
      - Images
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RemoveBackgroundRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemovalResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '504':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/images/results/{token}/:
    get:
      operationId: images_results_retrieve
      description: Returns the transparent PNG inline. The token is the signed value
        from result_url.
      summary: Preview a cutout
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - Images
      security:
      - {}
      responses:
        '200':
          description: Inline image/png with a real alpha channel.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/images/results/{token}/download/:
    get:
      operationId: images_results_download_retrieve
      description: 'PNG keeps transparency. JPEG flattens the cutout onto `background`,
        which must be #RRGGBB. The default background is white. `jpg` is accepted
        as an alias of `jpeg`.'
      summary: Download a cutout
      parameters:
      - in: query
        name: background
        schema:
          type: string
        description: 'Hex color used when format is jpeg. Example: #FFFFFF.'
      - in: query
        name: format
        schema:
          type: string
          enum:
          - jpeg
          - jpg
          - png
        description: Download format. Defaults to png.
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - Images
      security:
      - {}
      responses:
        '200':
          description: Attachment image/png or image/jpeg.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '410':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
components:
  schemas:
    AiStatus:
      type: object
      properties:
        provider:
          type: string
        model:
          type: string
          nullable: true
        available:
          type: boolean
          description: False means removal will fail instead of returning the original.
        model_cached:
          type: boolean
        detail:
          type: string
      required:
      - available
      - detail
      - model
      - model_cached
      - provider
    ConfigResponse:
      type: object
      properties:
        max_upload_bytes:
          type: integer
        max_dimension_px:
          type: integer
        supported_formats:
          type: array
          items:
            type: string
        output_formats:
          type: array
          items:
            type: string
        retention_minutes:
          type: integer
        ai_provider:
          type: string
        ai_model:
          type: string
          nullable: true
        contact_email:
          type: string
          nullable: true
      required:
      - ai_model
      - ai_provider
      - contact_email
      - max_dimension_px
      - max_upload_bytes
      - output_formats
      - retention_minutes
      - supported_formats
    ErrorBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: {}
      required:
      - code
      - details
      - message
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
    HealthResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
        service:
          type: string
        ai:
          $ref: '#/components/schemas/AiStatus'
      required:
      - ai
      - service
      - status
    RemovalResponse:
      type: object
      properties:
        id:
          type: string
          description: Random id for this result. It is not a database key.
        original_filename:
          type: string
          description: Sanitized name of the uploaded file.
        width:
          type: integer
        height:
          type: integer
        output_format:
          type: string
          description: Always png. JPEG is produced by the download endpoint.
        result_url:
          type: string
          description: Signed path for an inline transparent PNG.
        download_url:
          type: string
          description: Signed path for a file download. Add format and background
            there.
        expires_at:
          type: string
          format: date-time
          description: When the signed links stop working.
      required:
      - download_url
      - expires_at
      - height
      - id
      - original_filename
      - output_format
      - result_url
      - width
    RemoveBackgroundRequest:
      type: object
      properties:
        image:
          type: string
          format: binary
          description: One PNG, JPEG, or WebP file. The server checks the bytes, not
            only the extension.
      required:
      - image
    StatusEnum:
      enum:
      - ok
      - degraded
      type: string
      description: |-
        * `ok` - ok
        * `degraded` - degraded
tags:
- name: System
  description: Health and public limits. No secrets.
- name: Images
  description: Upload, preview, and download one cutout.
