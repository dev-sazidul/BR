# Builds both Docker images (remover and web) and deploys over SSH to VPS.
# One-time VPS setup: folder /var/www/imagecustomize with .env file.
name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production-imagecustomize
      cancel-in-progress: false
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/imagecustomize' }}
      REMOVER_IMAGE: solva-remover
      WEB_IMAGE: solva-web
    steps:
      - name: Check deploy settings
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret is not set."
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build remover image
        uses: docker/build-push-action@v5
        with:
          context: remover
          load: true
          provenance: false
          tags: ${{ env.REMOVER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          load: true
          provenance: false
          tags: ${{ env.WEB_IMAGE }}:${{ github.sha }}
          build-args: |
            SITE_URL=${{ vars.SITE_URL || 'https://imagecustomize.site' }}
            VITE_ADSENSE_CLIENT_ID=${{ vars.VITE_ADSENSE_CLIENT_ID || '' }}
            VITE_ADSENSE_ENABLED=${{ vars.VITE_ADSENSE_ENABLED || '' }}
            VITE_ADSENSE_MODE=${{ vars.VITE_ADSENSE_MODE || 'manual' }}
            VITE_ADSENSE_REQUIRE_CONSENT=${{ vars.VITE_ADSENSE_REQUIRE_CONSENT || 'true' }}
            VITE_ADSENSE_SLOT_HEADER=${{ vars.VITE_ADSENSE_SLOT_HEADER || '' }}
            VITE_ADSENSE_SLOT_WORKSPACE=${{ vars.VITE_ADSENSE_SLOT_WORKSPACE || '' }}
            VITE_ADSENSE_SLOT_MID=${{ vars.VITE_ADSENSE_SLOT_MID || '' }}
            VITE_ADSENSE_SLOT_FOOTER=${{ vars.VITE_ADSENSE_SLOT_FOOTER || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF
          ssh vps true

      - name: Copy docker-compose and images to VPS
        run: |
          ssh vps "mkdir -p $(printf '%q' "$DEPLOY_PATH")"
          scp docker-compose.yml "vps:$DEPLOY_PATH/docker-compose.yml"
          echo "Sending remover image..."
          docker save "$REMOVER_IMAGE:$GITHUB_SHA" | gzip | ssh vps 'gunzip | docker load'
          echo "Sending web image..."
          docker save "$WEB_IMAGE:$GITHUB_SHA" | gzip | ssh vps 'gunzip | docker load'

      - name: Start Solva release
        run: |
          ssh vps "bash -s -- $(printf '%q ' "$DEPLOY_PATH" "$REMOVER_IMAGE" "$WEB_IMAGE" "$GITHUB_SHA")" <<'EOF'
          set -euo pipefail
          deploy_path=$1 remover_image=$2 web_image=$3 release=$4
          cd "$deploy_path"

          if [ ! -f .env ]; then
            echo "::error::$deploy_path/.env is missing. Create it on VPS."
            exit 1
          fi

          # Tag incoming release images as local targets
          docker tag "$remover_image:$release" "$remover_image:latest"
          docker tag "$web_image:$release" "$web_image:latest"
          docker image rm "$remover_image:$release" "$web_image:$release" >/dev/null 2>&1 || true

          # Start services
          docker compose up -d --remove-orphans

          echo "Waiting for services to become healthy..."
          timeout=180
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            if docker compose ps web | grep -q "Up"; then
              echo "Solva is up and running!"
              docker image prune -f >/dev/null 2>&1 || true
              exit 0
            fi
            sleep 5
            elapsed=$((elapsed + 5))
          done

          echo "::error::Solva did not start within $timeout seconds. Logs:"
          docker compose logs --tail 50
          exit 1
          EOF

