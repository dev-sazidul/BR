# Two services.
#
#   web      Next.js: every page and the public /api/v1 routes, accounts in SQLite.
#   remover  FastAPI: background removal. No published port. Only `web` reaches
#            it, over this Compose network.
#
# `web` is published on this machine's loopback interface only. Put a TLS
# reverse proxy (Caddy, nginx) in front of it for public traffic, and leave
# TRUSTED_PROXY_COUNT at 1 so rate limits use the address that proxy saw.

services:
  remover:
    build: ./remover
    env_file: .env
    environment:
      REMOVER_HOST: 0.0.0.0
      REMOVER_PORT: "8001"
      U2NET_HOME: /models
    volumes:
      - model_data:/models
    expose:
      - "8001"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        SITE_URL: ${SITE_URL:-http://localhost:8080}
        VITE_ADSENSE_CLIENT_ID: ${VITE_ADSENSE_CLIENT_ID:-}
        VITE_ADSENSE_ENABLED: ${VITE_ADSENSE_ENABLED:-}
        VITE_ADSENSE_MODE: ${VITE_ADSENSE_MODE:-manual}
        VITE_ADSENSE_REQUIRE_CONSENT: ${VITE_ADSENSE_REQUIRE_CONSENT:-true}
        VITE_ADSENSE_SLOT_HEADER: ${VITE_ADSENSE_SLOT_HEADER:-}
        VITE_ADSENSE_SLOT_WORKSPACE: ${VITE_ADSENSE_SLOT_WORKSPACE:-}
        VITE_ADSENSE_SLOT_MID: ${VITE_ADSENSE_SLOT_MID:-}
        VITE_ADSENSE_SLOT_FOOTER: ${VITE_ADSENSE_SLOT_FOOTER:-}
    env_file: .env
    environment:
      DATABASE_URL: file:/data/solva.db
      REMOVER_URL: http://remover:8001
    volumes:
      - app_data:/data
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      remover:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # The ONNX model (u2net is about 176 MB), downloaded once.
  model_data:
  # The SQLite database. Back this up: it holds every account.
  app_data:
