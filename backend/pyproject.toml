[project]
name = "solva"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Django>=5.1,<5.3",
  "djangorestframework>=3.15,<3.17",
  "django-cors-headers>=4.6,<5",
  "drf-spectacular>=0.27,<0.29",
  "Pillow>=10.4,<12",
  "python-dotenv>=1.0,<2",
  "gunicorn>=23,<24",
  "whitenoise>=6.8,<7",
  "celery>=5.4,<6",
  "redis>=5.2,<6",
  "rembg>=2.0.61,<3",
  "onnxruntime>=1.20,<2",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "config.wsgi:application"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["config", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["E501", "I001"]
