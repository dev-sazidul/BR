<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Offline — Solva</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f1ea;
        color: #1f1a17;
        font-family: Outfit, "Avenir Next", "Segoe UI", sans-serif;
        padding: 24px;
      }
      main {
        max-width: 32rem;
      }
      h1 {
        font-size: 1.875rem;
        margin: 0 0 0.75rem;
      }
      p {
        color: #5c554e;
        line-height: 1.7;
      }
      button {
        margin-top: 1rem;
        border: 0;
        border-radius: 999px;
        background: #0f6e6b;
        color: white;
        font: inherit;
        font-weight: 600;
        padding: 0.7rem 1.2rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Solva can open pages saved on this device. Removing a background, signing in, and downloading a new result need an internet connection.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
